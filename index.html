<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pac-Man – 3 Seviye</title>
<style>
  :root { --bg:#000; --fg:#ffe600; --muted:#8a8fb0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff;
    font-family:"Courier New", ui-monospace, monospace; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px; }
  #hud { width:min(96vw, 532px); display:flex; justify-content:space-between; font-size:15px; letter-spacing:1px; color:var(--fg); }
  #hud span b { color:#fff; font-weight:normal; }
  canvas { width:min(96vw, 532px); height:auto; aspect-ratio:1; background:#000; touch-action:none; image-rendering:auto;
    border:2px solid #1a1a4a; border-radius:8px; box-shadow:0 0 30px rgba(40,60,255,.35); }
  #help { width:min(96vw, 532px); text-align:center; color:var(--muted); font-size:12px; line-height:1.5; }
</style>
</head>
<body>
<div id="hud">
  <span>SKOR <b id="score">0</b></span>
  <span>SEVİYE <b id="level">1</b>/3</span>
  <span>REKOR <b id="hi">0</b></span>
  <span>CAN <b id="lives">3</b></span>
</div>
<canvas id="c" width="532" height="532"></canvas>
<div id="help">Ok tuşları / WASD: hareket · P: duraklat · M: ses aç/kapa · Mobilde: ekranda kaydır</div>

<script>
"use strict";
// ---------------------------------------------------------------- Mazes
// Her satırın sol yarısı (10 karakter, son karakter orta sütun) yazılır, sağ yarısı aynalanır.
// # duvar  . nokta  o güç topu  (boşluk) boş  - hayalet kapısı  P Pac-Man başlangıcı
const MID = [
  "####.#....",
  "####.#.##-",
  "    ...#  ",
  "####.#.###",
  "####.#....",
];
const MAZE_HALVES = [
  // Seviye 1
  ["##########","#........#","#o##.###.#","#.........","#.##.#.###","#....#...#",
   ...MID,
   "#........#","#.##.###.#","#o.#.....P","##.#.#.###","#....#...#","#.######.#","#.........","##########"],
  // Seviye 2
  ["##########","#...#.....","#.#.#.###.","#o........","#.###.#.#.","#.....#...",
   ...MID,
   "#.........","#.##.#.##.","#o.......P","#.#.###.#.","#.#.....#.","#.........","#.##.#.##.","##########"],
  // Seviye 3
  ["##########","#.........","#.#.#.#.#.","#o#.......","#.#.###.#.","#...#.....",
   ...MID,
   "#.........","#.#.#.#.#.","#o#......P","#.#.###.#.","#.........","#.##.#.##.","#.........","##########"],
];
const MAZES = MAZE_HALVES.map(half => half.map(r => {
  const left = r.slice(0, 9);
  return left + r[9] + left.split("").reverse().join("");
}));

const T = 28, W = 19, H = 19;
const LEVELS = [
  { name:"Seviye 1", pac:6.4, ghost:0.78, fright:7, ghosts:3, modes:[6,20,5,20,Infinity], wall:"#2a3bff" },
  { name:"Seviye 2", pac:6.6, ghost:0.88, fright:5, ghosts:4, modes:[5,20,5,25,Infinity], wall:"#d63bff" },
  { name:"Seviye 3", pac:6.8, ghost:0.97, fright:3, ghosts:4, modes:[4,25,4,30,Infinity], wall:"#19c37d" },
];
const UP={x:0,y:-1}, LEFT={x:-1,y:0}, DOWN={x:0,y:1}, RIGHT={x:1,y:0}, NONE={x:0,y:0};
const DIRS = [UP, LEFT, DOWN, RIGHT];
const same = (a,b) => a.x===b.x && a.y===b.y;
const opp = d => ({x:-d.x, y:-d.y});

// ---------------------------------------------------------------- State
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
let hi = 0;
try { hi = +localStorage.getItem("pacman_hi") || 0; } catch(e) {}

let level, score, lives, grid, dotsLeft, pac, ghosts, state, stateTimer;
let modeIdx, modeTimer, frightTimer, combo, pops, time = 0, paused = false, muted = false;
state = "menu";

const cfg = () => LEVELS[level];

function newGame() {
  level = 0; score = 0; lives = 3;
  loadLevel();
}
function loadLevel() {
  grid = MAZES[level].map(r => r.split(""));
  dotsLeft = 0;
  for (const r of grid) for (const c of r) if (c === "." || c === "o") dotsLeft++;
  resetActors();
}
function resetActors() {
  pac = { x:9, y:13, dir:NONE, next:NONE, face:LEFT, dead:0 };
  const defs = [
    { name:"blinky", color:"#ff2020", x:9,  y:6, corner:{x:17,y:0},  wait:0,  st:"normal" },
    { name:"pinky",  color:"#ffb8ff", x:9,  y:8, corner:{x:1,y:0},   wait:2,  st:"house" },
    { name:"inky",   color:"#00e5ff", x:8,  y:8, corner:{x:17,y:18}, wait:5,  st:"house" },
    { name:"clyde",  color:"#ffb852", x:10, y:8, corner:{x:1,y:18},  wait:8,  st:"house" },
  ];
  ghosts = defs.slice(0, cfg().ghosts).map(d => ({ ...d, dir: d.st === "normal" ? LEFT : NONE, fright:false, reverse:false, bob:Math.random()*6 }));
  modeIdx = 0; modeTimer = cfg().modes[0]; frightTimer = 0; combo = 0; pops = [];
  setState("ready", 2.2);
  updateHud();
}
function setState(s, t = 0) { state = s; stateTimer = t; }
function updateHud() {
  $("score").textContent = score; $("level").textContent = (level|0) + 1;
  $("hi").textContent = Math.max(hi, score); $("lives").textContent = "●".repeat(Math.max(lives, 0)) || "0";
}
function addScore(n) {
  score += n;
  if (score > hi) { hi = score; try { localStorage.setItem("pacman_hi", hi); } catch(e) {} }
  updateHud();
}

// ---------------------------------------------------------------- Audio
let ac = null;
function beep(freq, dur = 0.06, type = "square", vol = 0.04) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}

// ---------------------------------------------------------------- Movement
function tile(x, y) {
  if (y < 0 || y >= H) return "#";
  return grid[y][((x % W) + W) % W];
}
function canMove(x, y, d, isGhost, door) {
  const t = tile(x + d.x, y + d.y);
  if (t === "#") return false;
  if (t === "-") return !!door;
  return true;
}
function advance(e, dist, choose) {
  while (dist > 1e-9) {
    const cx = Math.round(e.x), cy = Math.round(e.y);
    const atC = Math.abs(e.x - cx) < 1e-6 && Math.abs(e.y - cy) < 1e-6;
    if (atC) {
      e.x = cx; e.y = cy;
      choose(e);
      if (same(e.dir, NONE)) return;
    }
    let next = 1;
    if (!atC) {
      if (e.dir.x > 0) next = Math.ceil(e.x) - e.x;
      else if (e.dir.x < 0) next = e.x - Math.floor(e.x);
      else if (e.dir.y > 0) next = Math.ceil(e.y) - e.y;
      else next = e.y - Math.floor(e.y);
    }
    const s = Math.min(dist, next);
    e.x += e.dir.x * s; e.y += e.dir.y * s; dist -= s;
    if (s === next) { e.x = Math.round(e.x); e.y = Math.round(e.y); }
    if (e.x <= -1) e.x += W; else if (e.x >= W) e.x -= W;
  }
}

function pacChoose(p) {
  if (!same(p.next, NONE) && canMove(p.x, p.y, p.next, false, false)) p.dir = p.next;
  if (!canMove(p.x, p.y, p.dir, false, false)) p.dir = NONE;
  if (!same(p.dir, NONE)) p.face = p.dir;
}

function ghostChoose(g) {
  const door = g.st === "leaving" || g.st === "eaten";
  if (g.reverse) {
    g.reverse = false;
    if (g.st === "normal" && !same(g.dir, NONE)) { g.dir = opp(g.dir); return; }
  }
  let opts = DIRS.filter(d => !same(d, opp(g.dir)) && canMove(g.x, g.y, d, true, door));
  if (!opts.length) opts = DIRS.filter(d => canMove(g.x, g.y, d, true, door));
  if (!opts.length) { g.dir = NONE; return; }
  if (g.fright && g.st === "normal") { g.dir = opts[(Math.random() * opts.length) | 0]; return; }
  const tg = ghostTarget(g);
  let best = opts[0], bd = Infinity;
  for (const d of opts) {
    let nx = g.x + d.x; if (nx < 0) nx += W; if (nx >= W) nx -= W;
    const dd = (nx - tg.x) ** 2 + (g.y + d.y - tg.y) ** 2;
    if (dd < bd) { bd = dd; best = d; }
  }
  g.dir = best;
}

function ghostTarget(g) {
  if (g.st === "eaten") return { x:9, y:8 };
  if (g.st === "leaving") return { x:9, y:6 };
  const scatter = modeIdx % 2 === 0;
  if (scatter) return g.corner;
  const pd = same(pac.face, NONE) ? LEFT : pac.face;
  switch (g.name) {
    case "pinky": return { x:pac.x + pd.x * 4, y:pac.y + pd.y * 4 };
    case "inky": {
      const b = ghosts[0], px = pac.x + pd.x * 2, py = pac.y + pd.y * 2;
      return { x:px + (px - b.x), y:py + (py - b.y) };
    }
    case "clyde": return Math.hypot(g.x - pac.x, g.y - pac.y) > 8 ? { x:pac.x, y:pac.y } : g.corner;
    default: return { x:pac.x, y:pac.y };
  }
}

function releaseGhost(g) {
  g.st = "leaving"; g.y = 8;
  g.dir = g.x < 9 ? RIGHT : g.x > 9 ? LEFT : UP;
}

// ---------------------------------------------------------------- Update
function update(dt) {
  time += dt;
  if (state === "ready") { stateTimer -= dt; if (stateTimer <= 0) setState("play"); return; }
  if (state === "dying") {
    stateTimer -= dt; pac.dead = Math.min(1, pac.dead + dt / 1.4);
    if (stateTimer <= 0) {
      lives--;
      if (lives <= 0) { updateHud(); setState("gameover"); }
      else { resetActors(); }
    }
    return;
  }
  if (state === "clear") {
    stateTimer -= dt;
    if (stateTimer <= 0) {
      if (level >= LEVELS.length - 1) setState("win");
      else { level++; loadLevel(); }
    }
    return;
  }
  if (state !== "play") return;

  const c = cfg();
  // modes
  if (frightTimer > 0) {
    frightTimer -= dt;
    if (frightTimer <= 0) for (const g of ghosts) g.fright = false;
  } else {
    modeTimer -= dt;
    if (modeTimer <= 0 && modeIdx < c.modes.length - 1) {
      modeIdx++; modeTimer = c.modes[modeIdx];
      for (const g of ghosts) if (g.st === "normal") g.reverse = true;
    }
  }
  // pacman
  advance(pac, c.pac * dt, pacChoose);
  const tx = Math.round(pac.x), ty = Math.round(pac.y), t = tile(tx, ty);
  if (t === "." || t === "o") {
    grid[ty][tx] = " "; dotsLeft--;
    if (t === ".") { addScore(10); beep(dotsLeft % 2 ? 380 : 300); }
    else {
      addScore(50); beep(120, 0.2, "sawtooth", 0.05);
      frightTimer = c.fright; combo = 0;
      for (const g of ghosts) if (g.st !== "eaten") { g.fright = true; if (g.st === "normal") g.reverse = true; }
    }
    if (dotsLeft <= 0) { setState("clear", 2); beep(660, 0.3, "triangle", 0.06); return; }
  }
  // ghosts
  for (const g of ghosts) {
    if (g.st === "house") {
      g.bob += dt * 6;
      g.wait -= dt;
      if (g.wait <= 0) releaseGhost(g);
      continue;
    }
    let sp = c.pac * c.ghost;
    if (g.st === "eaten") sp = c.pac * 2.2;
    else if (g.fright) sp = c.pac * 0.5;
    advance(g, sp * dt, ghostChoose);
    if (g.st === "leaving" && g.x === 9 && g.y <= 6.5) { g.st = "normal"; }
    if (g.st === "eaten" && g.x === 9 && g.y === 8) { g.fright = false; g.st = "leaving"; g.dir = UP; }
  }
  // collisions
  for (const g of ghosts) {
    if (g.st === "house" || g.st === "eaten") continue;
    if (Math.hypot(g.x - pac.x, g.y - pac.y) < 0.65) {
      if (g.fright) {
        g.st = "eaten"; g.fright = false;
        const pts = 200 << combo++; addScore(pts);
        pops.push({ x:g.x, y:g.y, txt:String(pts), t:1 });
        beep(700, 0.15, "square", 0.05);
      } else {
        setState("dying", 1.8); pac.dead = 0; beep(180, 0.5, "sawtooth", 0.06);
        return;
      }
    }
  }
  for (const p of pops) p.t -= dt;
  pops = pops.filter(p => p.t > 0);
}

// ---------------------------------------------------------------- Render
function drawMaze() {
  const col = cfg().wall;
  const flash = state === "clear" && Math.floor(stateTimer * 6) % 2 === 0;
  ctx.lineCap = "round";
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = grid[y][x], px = x * T, py = y * T;
    if (t === "#") {
      ctx.fillStyle = "rgba(20,30,120,.35)"; ctx.fillRect(px, py, T, T);
      ctx.strokeStyle = flash ? "#fff" : col; ctx.lineWidth = 3;
      ctx.shadowColor = flash ? "#fff" : col; ctx.shadowBlur = 6;
      ctx.beginPath();
      const open = (dx, dy) => { const nx = x + dx, ny = y + dy; return ny < 0 || ny >= H || nx < 0 || nx >= W ? false : grid[ny][nx] !== "#"; };
      const i = 2;
      if (open(0,-1)) { ctx.moveTo(px+i, py+i); ctx.lineTo(px+T-i, py+i); }
      if (open(0, 1)) { ctx.moveTo(px+i, py+T-i); ctx.lineTo(px+T-i, py+T-i); }
      if (open(-1,0)) { ctx.moveTo(px+i, py+i); ctx.lineTo(px+i, py+T-i); }
      if (open( 1,0)) { ctx.moveTo(px+T-i, py+i); ctx.lineTo(px+T-i, py+T-i); }
      ctx.stroke(); ctx.shadowBlur = 0;
    } else if (t === "-") {
      ctx.fillStyle = "#ffb8ff"; ctx.fillRect(px, py + T/2 - 2, T, 4);
    } else if (t === ".") {
      ctx.fillStyle = "#ffd9a8"; ctx.beginPath(); ctx.arc(px + T/2, py + T/2, 2.6, 0, 7); ctx.fill();
    } else if (t === "o") {
      if (Math.floor(time * 4) % 2 === 0) {
        ctx.fillStyle = "#ffd9a8"; ctx.beginPath(); ctx.arc(px + T/2, py + T/2, 7, 0, 7); ctx.fill();
      }
    }
  }
}

function drawPac() {
  const cx = pac.x * T + T/2, cy = pac.y * T + T/2, r = T/2 - 2;
  const ang = Math.atan2(pac.face.y, pac.face.x);
  ctx.fillStyle = "#ffe600"; ctx.beginPath();
  if (state === "dying") {
    const a = pac.dead * Math.PI;
    ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, -Math.PI/2 + a, -Math.PI/2 - a + Math.PI*2);
  } else {
    const moving = !same(pac.dir, NONE) && state === "play";
    const m = moving ? (0.05 + Math.abs(Math.sin(time * 14)) * 0.30) * Math.PI : 0.2 * Math.PI;
    ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, ang + m, ang - m + Math.PI*2);
  }
  ctx.closePath(); ctx.fill();
}

function drawGhost(g) {
  const cx = g.x * T + T/2, cy = g.y * T + T/2 + (g.st === "house" ? Math.sin(g.bob) * 3 : 0), r = T/2 - 2;
  const flashing = g.fright && frightTimer < 2 && Math.floor(time * 5) % 2 === 0;
  if (g.st !== "eaten") {
    ctx.fillStyle = g.fright ? (flashing ? "#fff" : "#2121de") : g.color;
    ctx.beginPath();
    ctx.arc(cx, cy - 1, r, Math.PI, 0);
    ctx.lineTo(cx + r, cy + r);
    const n = 3, w = (2 * r) / n, ph = Math.floor(time * 8) % 2;
    for (let i = 0; i < n; i++) {
      const x0 = cx + r - i * w;
      ctx.lineTo(x0 - w/2, cy + r - (((i + ph) % 2) ? 4 : 0));
      ctx.lineTo(x0 - w, cy + r);
    }
    ctx.closePath(); ctx.fill();
  }
  if (g.fright && g.st !== "eaten") {
    ctx.fillStyle = flashing ? "#d00" : "#ffd9a8";
    ctx.fillRect(cx - 5, cy - 3, 3, 3); ctx.fillRect(cx + 2, cy - 3, 3, 3);
  } else {
    const ex = same(g.dir, NONE) ? 0 : g.dir.x * 2, ey = same(g.dir, NONE) ? 0 : g.dir.y * 2;
    for (const o of [-5, 5]) {
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(cx + o, cy - 3, 4, 5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#1a1aff"; ctx.beginPath(); ctx.arc(cx + o + ex, cy - 3 + ey, 2, 0, 7); ctx.fill();
    }
  }
}

function banner(text, color = "#ffe600", sub) {
  ctx.textAlign = "center"; ctx.fillStyle = color;
  ctx.font = "bold 30px 'Courier New', monospace"; ctx.fillText(text, cv.width/2, 11.2 * T);
  if (sub) { ctx.fillStyle = "#fff"; ctx.font = "15px 'Courier New', monospace"; ctx.fillText(sub, cv.width/2, 11.2 * T + 28); }
}

function render() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (state === "menu") {
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffe600"; ctx.font = "bold 54px 'Courier New', monospace"; ctx.fillText("PAC-MAN", cv.width/2, 190);
    ctx.fillStyle = "#ffe600"; ctx.beginPath();
    const m = 0.1 + Math.abs(Math.sin(time * 6)) * 0.3;
    ctx.moveTo(cv.width/2, 260); ctx.arc(cv.width/2, 260, 34, m * Math.PI, (2 - m) * Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "16px 'Courier New', monospace";
    ctx.fillText("3 seviye · 4 hayalet · 3 can", cv.width/2, 340);
    if (Math.floor(time * 2) % 2 === 0) { ctx.fillStyle = "#ffe600"; ctx.fillText("ENTER / SPACE / DOKUN → BAŞLA", cv.width/2, 400); }
    return;
  }
  drawMaze();
  if (state !== "clear" || Math.floor(stateTimer * 6) % 2) {
    for (const g of ghosts) if (state !== "dying" || true) { if (state === "dying" && pac.dead > 0.05) continue; drawGhost(g); }
  }
  drawPac();
  ctx.textAlign = "center"; ctx.font = "bold 13px 'Courier New', monospace"; ctx.fillStyle = "#0ff";
  for (const p of pops) ctx.fillText(p.txt, p.x * T + T/2, p.y * T + T/2 + 4);
  if (state === "ready") banner("HAZIR!", "#ffe600", cfg().name);
  if (paused) banner("DURAKLATILDI", "#fff", "devam için P");
  if (state === "gameover") banner("OYUN BİTTİ", "#ff3030", "Skor " + score + " · tekrar için ENTER");
  if (state === "win") banner("KAZANDIN!", "#3dff7a", "Skor " + score + " · tekrar için ENTER");
}

// ---------------------------------------------------------------- Loop & input
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "menu") time += dt;
  else if (!paused) { const n = 3; for (let i = 0; i < n; i++) update(dt / n); }
  render();
  requestAnimationFrame(frame);
}

function startOrRestart() {
  if (state === "menu" || state === "gameover" || state === "win") newGame();
}
function steer(d) {
  if (!pac) return;
  pac.next = d;
  if (state === "play" && !same(pac.dir, NONE) && same(d, opp(pac.dir))) { pac.dir = d; pac.face = d; }
}
const KEYS = {
  ArrowUp:UP, w:UP, W:UP, ArrowLeft:LEFT, a:LEFT, A:LEFT,
  ArrowDown:DOWN, s:DOWN, S:DOWN, ArrowRight:RIGHT, d:RIGHT, D:RIGHT,
};
addEventListener("keydown", e => {
  if (KEYS[e.key]) { e.preventDefault(); steer(KEYS[e.key]); }
  else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); startOrRestart(); }
  else if (e.key === "p" || e.key === "P") { if (state === "play" || paused) paused = !paused; }
  else if (e.key === "m" || e.key === "M") muted = !muted;
});
let ts = null;
cv.addEventListener("touchstart", e => { e.preventDefault(); const t = e.touches[0]; ts = { x:t.clientX, y:t.clientY }; startOrRestart(); }, { passive:false });
cv.addEventListener("touchmove", e => {
  e.preventDefault(); if (!ts) return;
  const t = e.touches[0], dx = t.clientX - ts.x, dy = t.clientY - ts.y;
  if (Math.hypot(dx, dy) < 24) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP));
  ts = { x:t.clientX, y:t.clientY };
}, { passive:false });
cv.addEventListener("click", startOrRestart);

level = 0; lives = 3; score = 0; updateHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
